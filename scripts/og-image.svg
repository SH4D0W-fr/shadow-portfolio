  <rect x="99" y="452" width="180" height="5" rx="2.5" fill="url(#rule)"/>
  <text x="96" y="512" fill="#a1a1a1" font-size="40" font-weight="500">Développeur FiveM, Python &amp; C#</text>
  <text x="96" y="574" fill="#6b6b6b" font-size="27" font-weight="400">shadow-dev.fr</text>

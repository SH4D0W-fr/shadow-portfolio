<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/dev.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Portfolio de SHADOW, développeur front-end : interfaces web rapides, accessibles et soignées."
    />
    <title>SHADOW — Développeur Front-End</title>
    <script>
      // Applique le thème mémorisé avant le premier rendu, pour éviter un flash.
      try {
        var t = localStorage.getItem("shadow-theme");
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
